name: Worker safety checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
# Cancel superseded PR validations only. Preserve every main push check.
concurrency:
  group: worker-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only development dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit safety tests
        run: npm test
      - name: PHP syntax check for WordPress view
        run: php -l atn-lightview.php
