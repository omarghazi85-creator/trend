name: Verify official public archive transport
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-live-archive.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
concurrency:
  group: official-archive-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm public Jetpack page API has archived pages
        shell: bash
        run: |
          set -euo pipefail
          url='https://public-api.wordpress.com/rest/v1.1/sites/250183068/posts/?type=page&number=20&offset=0'
          status=$(curl --silent --show-error --location --max-time 20 --connect-timeout 8 --retry 1 --retry-delay 2 -o /tmp/archive.json -w '%{http_code}' --header 'Accept: application/json' "$url")
          echo "Official WordPress.com API status: $status"
          if [[ "$status" != '200' ]]; then
            echo "::error::Official Jetpack public archive API returned HTTP $status"
            exit 1
          fi
          jq -e '.found >= 1 and (.posts | type == "array") and ([.posts[] | select((.parent | type == "object" and .ID == 61269) and .status == "publish" and (.URL | startswith("https://arabiatrend.com/trend-archive/")))] | length) >= 1' /tmp/archive.json >/dev/null
          jq -r '"Archived results in sample: \([.posts[] | select((.parent | type == "object" and .ID == 61269))] | length) | total public pages: \(.found)"' /tmp/archive.json
          latest=$(jq -r '[.posts[] | select((.parent | type == "object" and .ID == 61269) and .status == "publish") | .date | select(type == "string")] | max // empty' /tmp/archive.json)
          if [[ -z "$latest" ]]; then
            echo "::error::No dated archive pages in current public sample"
            exit 1
          fi
          latest_epoch=$(date -u -d "$latest" +%s)
          now_epoch=$(date -u +%s)
          age_hours=$(( (now_epoch - latest_epoch) / 3600 ))
          echo "Latest archived page: $latest | age in hours: $age_hours"
          if (( age_hours > 48 )); then
            echo "::warning::Latest archived page is older than 48h; inspect scheduled collection and publication"
          fi
          if (( age_hours > 96 )); then
            echo "::error::Archive has no recent published material for more than 96h"
            exit 1
          fi
          echo 'Official public archive response and freshness validated'
