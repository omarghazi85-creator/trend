name: Package ArabiaTrend Light View
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-lightview.yml'
      - 'atn-lightview.php'
      - 'includes/atn-section.php'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/package-lightview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHP files
        run: |
          set -euo pipefail
          php -l atn-lightview.php
          php -l includes/atn-section.php
          grep -q 'Version: 0.12.7' atn-lightview.php
      - name: Build plugin directory
        run: |
          set -euo pipefail
          install -d release/trend-atn-lightview-plugin/includes
          cp atn-lightview.php release/trend-atn-lightview-plugin/atn-lightview.php
          cp includes/atn-section.php release/trend-atn-lightview-plugin/includes/atn-section.php
          (cd release && zip -qr /tmp/arabiatrend-lightview-installable.zip trend-atn-lightview-plugin)
          unzip -Z1 /tmp/arabiatrend-lightview-installable.zip | grep -qx 'trend-atn-lightview-plugin/atn-lightview.php'
          unzip -Z1 /tmp/arabiatrend-lightview-installable.zip | grep -qx 'trend-atn-lightview-plugin/includes/atn-section.php'
      - name: Retain installable plugin as internal workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightview-installable-0-12-7
          path: release/
          if-no-files-found: error
          retention-days: 7
