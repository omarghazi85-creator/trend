name: Verify official public archive transport
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-live-archive.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
concurrency:
  group: official-archive-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm public Jetpack page API has archived pages
        shell: bash
        run: |
          set -euo pipefail
          url='https://public-api.wordpress.com/rest/v1.1/sites/250183068/posts/?type=page&number=20&offset=0'
          status=$(curl --silent --show-error --location --max-time 20 --connect-timeout 8 --retry 1 --retry-delay 2 -o /tmp/archive.json -w '%{http_code}' --header 'Accept: application/json' "$url")
          echo "Official WordPress.com API status: $status"
          if [[ "$status" != '200' ]]; then
            echo "::error::Official Jetpack public archive API returned HTTP $status"
            exit 1
          fi
          jq -e '.found >= 1 and (.posts | type == "array") and ([.posts[] | select(.parent.ID == 61269 and .status == "publish" and (.URL | startswith("https://arabiatrend.com/trend-archive/")))] | length) >= 1' /tmp/archive.json >/dev/null
          jq -r '"Archived results in sample: \([.posts[] | select(.parent.ID == 61269)] | length) | total public pages: \(.found)"' /tmp/archive.json
          echo 'Official public archive response validated'
